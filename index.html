<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devin Clone MVP</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #1e1e1e;
            color: #fff;
            display: flex;
            height: 100vh;
            margin: 0;
        }

        #sidebar {
            width: 300px;
            background: #252526;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-right: 1px solid #333;
        }

        #editor {
            flex-grow: 1;
            padding: 20px;
            background: #1e1e1e;
            overflow-y: auto;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #3c3c3c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            resize: none;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background: #1177bb;
        }

        .log-entry {
            margin-top: 10px;
            font-size: 14px;
            padding: 8px;
            border-radius: 4px;
            background: #333;
        }

        pre {
            background: #000;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            color: #569cd6;
            font-family: monospace;
        }

        .error {
            color: #f48771;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <h2>Agent Controls</h2>
        <textarea id="taskInput" placeholder="E.g., Write a script to fetch a website title..."></textarea>
        <button onclick="sendTask()">Run Agents</button>
        <div id="agentLogs">
            <div class="log-entry">Waiting for input...</div>
        </div>
    </div>

    <div id="editor">
        <h2>Live Workspace</h2>
        <pre id="codeDisplay">// Generated code will appear here...</pre>
    </div>

    <script>
        // Connect to your FastAPI WebSocket server
        const ws = new WebSocket("ws://localhost:8000/ws");

        const logsDiv = document.getElementById("agentLogs");
        const codeDisplay = document.getElementById("codeDisplay");

        ws.onopen = () => console.log("Connected to backend!");

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "info") {
                addLog(`ℹ️ ${data.message}`);
            }
            else if (data.type === "update") {
                // Update the logs with the current agent
                const agentIcon = data.node === "developer" ? "🤖" : "🔎";
                addLog(`${agentIcon} ${data.node} finished a loop.`);

                // Update the code display
                if (data.state.code) {
                    codeDisplay.textContent = data.state.code;
                }

                // Show errors if the reviewer caught them
                if (data.state.error && data.state.error !== "SUCCESS") {
                    addLog(`❌ Error caught: ${data.state.error}`, true);
                }
            }
        };

        function sendTask() {
            const task = document.getElementById("taskInput").value;
            if (!task) return;

            logsDiv.innerHTML = ""; // Clear old logs
            codeDisplay.textContent = "// Agents are working...";

            // Send the JSON payload to the backend
            ws.send(JSON.stringify({ task: task }));
        }

        function addLog(text, isError = false) {
            const div = document.createElement("div");
            div.className = "log-entry" + (isError ? " error" : "");
            div.textContent = text;
            logsDiv.appendChild(div);
        }
    </script>
</body>

</html>
